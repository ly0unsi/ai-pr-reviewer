server.port=8080

spring.application.name=ai-pr-reviewer

# Spring AI Bedrock Converse Configuration
spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.converse.chat.options.model=anthropic.claude-3-5-sonnet-20241022-v2:0
spring.ai.bedrock.converse.chat.options.temperature=0.1

# GitHub API Configuration
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:your_github_pat_here} fgfg

# SonarQube API Configuration
sonarqube.api.base-url=${SONAR_HOST_URL:http://localhost:9000}
sonarqube.api.token=${SONAR_TOKEN:your_sonar_token_here}